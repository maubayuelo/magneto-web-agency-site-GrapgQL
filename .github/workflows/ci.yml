name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (baseline 146 errors — informational, not blocking)
        run: npm run lint
        continue-on-error: true
      # No `build` step: it would call the CMS, which SiteGround bot protection blocks from CI.
      # typegen writes .next/types (incl. validator.ts for pages/api routes), so typecheck catches
      # the route-type errors that `next build` would fail on.
      - name: Generate Next route types
        run: npx next typegen
      - run: npm run typecheck
      - run: npm test -- --run
